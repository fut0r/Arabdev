[project]
name = "arabdev-backend"
version = "1.0.0"
description = "ArabDev — REST API for the ArabDev developer community"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.15",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "nh3>=0.2.18",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.13", "ruff>=0.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade, simplify, comprehensions,
# bandit (security) and ruff's own checks.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "S", "RUF"]
ignore = [
    "B008",   # FastAPI declares dependencies as default arguments by design
    "SIM108", # a nested conditional expression is not clearer than if/else
    "RUF001", # Arabic text and typographic quotes in strings are intended
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]  # asserts and fake secrets are what tests are made of
# Prose: post bodies and email sentences read better unbroken than wrapped at 120 columns.
"app/demo_data.py" = ["E501"]
"app/seed_data.py" = ["E501"]
"app/services/email_service.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
