# Opens pull requests for dependency updates, and right away for security fixes.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/backend"] # requirements.txt (Vercel) and backend/pyproject.toml
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ["/backend", "/frontend"]
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
