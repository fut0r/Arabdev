# Runs the backend linter, tests and dependency audit, and the frontend linter, type check, format
# check and build, on every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint (ruff, including its security rules)
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - run: pytest
      - name: Known vulnerabilities in dependencies
        run: pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      # tsc, then vite build (which also checks the Content-Security-Policy hashes)
      - run: npm run build
