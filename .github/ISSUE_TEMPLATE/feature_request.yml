name: Feature idea
description: Suggest something new or a change to how something works
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Who runs into this, and what do they do today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered?
