    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta
      name="description"
      content="ArabDev منصة اجتماعية للمطوّرين الناطقين بالعربية: انشر شروحك التقنية بكتل شيفرة وجداول وصور، وتابع من يعملون على ما تعمل عليه، واقرأ خلاصة لها نهاية."
    />
    <meta name="theme-color" content="#D0152B" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://arabdev.site/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="ArabDev" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Link previews on social networks and chat apps. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArabDev" />
    <meta property="og:title" content="ArabDev — منصة المطوّرين العرب" />
    <meta
      property="og:description"
      content="منصة اجتماعية للمطوّرين الناطقين بالعربية: اكتب بالعربية، شارك أفكارك، واعثر على مجتمعك."
    />
    <meta property="og:url" content="https://arabdev.site/" />
    <meta property="og:image" content="https://arabdev.site/screenshots/dashboard.webp" />
    <meta property="og:image:width" content="1600" />
    <meta property="og:image:height" content="944" />
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArabDev — منصة المطوّرين العرب" />
    <meta
      name="twitter:description"
      content="منصة اجتماعية للمطوّرين الناطقين بالعربية: اكتب بالعربية، شارك أفكارك، واعثر على مجتمعك."
    />
    <meta name="twitter:image" content="https://arabdev.site/screenshots/dashboard.webp" />

    <link rel="preload" href="/fonts/tajawal/tajawal-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/anton/anton-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin />

    <!-- What the site is, in the form search engines read. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://arabdev.site/#organization",
            "name": "ArabDev",
            "url": "https://arabdev.site/",
            "email": "support@arabdev.site",
            "logo": "https://arabdev.site/favicon.svg",
            "description": "A social platform for Arabic-speaking developers, open source under the GNU GPL v3."
          },
          {
            "@type": "WebSite",
            "@id": "https://arabdev.site/#website",
            "url": "https://arabdev.site/",
            "name": "ArabDev",
            "inLanguage": ["ar", "en"],
            "publisher": { "@id": "https://arabdev.site/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "https://arabdev.site/search?q={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <script>
      // Apply the saved language and color scheme before the first paint (no flash).
      (function () {
        try {
          var lang = localStorage.getItem('arabdev.lang') === 'en' ? 'en' : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var mode = localStorage.getItem('arabdev.mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mui-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
      // Ads are requested without personalisation: no profile is built from who reads what.
      window.adsbygoogle = window.adsbygoogle || [];
      window.adsbygoogle.requestNonPersonalizedAds = 1;
    </script>
    <script
      id="adsbygoogle-script"
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9780622975838808"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
