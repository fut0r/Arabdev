server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Any redirects nginx issues stay on the public host and port.
    absolute_redirect off;

    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API and uploaded media are served by the FastAPI container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hashed build assets and fonts never change.
    location ~* ^/(assets|fonts)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Public pages a crawler should be able to read without JavaScript: the API writes the
    # page's title and text into the app shell (backend/app/services/page_service.py).
    # ...plus the IndexNow key file at /<32 hex characters>.txt (backend/app/services/indexnow.py).
    # The pattern is quoted because nginx would read the { of {32} as the start of a block.
    location ~ "^/(posts/[0-9]+|u/[^/]+|tags/[^/]+|explore|projects|series/[0-9]+|sitemap\.xml|rss\.xml|u/[^/]+/rss\.xml|tags/[^/]+/rss\.xml|[0-9a-f]{32}\.txt)$" {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pages for signed-in people, or of no use in search results: the shell, marked noindex,
    # so engines list the homepage and public pages rather than a sign-in screen.
    location ~ ^/(dashboard|login|forgot-password|reset-password|create|drafts|notifications|bookmarks|profile/edit|settings|admin|search|posts/[0-9]+/edit)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
        try_files /app.html =404;
    }

    # /about and /contact are built as pages of their own; every other path is client-side
    # routing and gets the untouched app shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /app.html;
    }
}
