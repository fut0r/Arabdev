# Security headers for the app shell and its assets, included from nginx.conf.
# (nginx drops server-level add_header lines in a location that sets its own, so each location
# includes this file.) The API sets its own headers in backend/app/main.py.
#
# The Content-Security-Policy stops other sites framing ArabDev (clickjacking), plugins, <base>
# hijacking and forms posting elsewhere. It deliberately does not restrict scripts or frames:
# Google AdSense and Cloudflare Turnstile load code and frames from many Google and Cloudflare
# hosts that change without notice, and a script allow-list would silently break both.
# Keep this in step with the "headers" block in vercel.json.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
