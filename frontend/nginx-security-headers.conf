# Security headers for the app shell and its assets, included from nginx.conf.
# (nginx drops server-level add_header lines in a location that sets its own, so each location
# includes this file.) The API sets its own headers in backend/app/main.py.
#
# The Content-Security-Policy stops other sites framing ArabDev (clickjacking), plugins, <base>
# hijacking and forms posting elsewhere. It deliberately does not restrict scripts or frames:
# Google AdSense and Cloudflare Turnstile load code and frames from many Google and Cloudflare
# hosts that change without notice, and a script allow-list would silently break both.
# Keep this in step with the "headers" block in vercel.json.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
# Staged, non-enforcing CSP (Round 3): Report-Only never blocks anything, it only reports what
# an enforcing policy would break, so AdSense/Turnstile cannot be silently broken by it.
# Hosts verified in the code: pagead2.googlesyndication.com (index.html, GoogleAd.tsx) and
# challenges.cloudflare.com (turnstileScript.ts). googleads.g.doubleclick.net and
# tpc.googlesyndication.com are not in the source; they are the hosts the AdSense script loads
# its frames/code from at runtime. googletagmanager.com is not used anywhere and is not listed.
# 'unsafe-inline' is in script-src/style-src because index.html carries a plain inline script
# (language/theme setup) and an inline <style>, and MUI injects inline styles: without it every
# page load would report the site's own code and drown the useful reports. Removing it is the
# step before enforcement, once the inline script is hashed or moved to a file.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://challenges.cloudflare.com; frame-src https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://tpc.googlesyndication.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Same value the API sends (backend/app/main.py). Browsers ignore HSTS received over plain
# HTTP (RFC 6797), so the local Docker nginx on port 80 is unaffected; it takes effect wherever
# this snippet is served over HTTPS in production.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
